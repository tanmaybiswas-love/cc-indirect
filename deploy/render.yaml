services:
  - type: web
    name: cc-indirect-api
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: cc-indirect-db
          property: connectionString
      - key: CC_V1_URL
        value: https://api.b.ai/v1
      - key: CC_V1_KEY
        sync: false
      - key: CC_V2_KEY
        sync: false
      - key: KAGGLE_WORKER_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: cc-indirect
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: cc-indirect-api
          type: web
          property: url

databases:
  - name: cc-indirect-db
    plan: free
    ipAllowList: []
