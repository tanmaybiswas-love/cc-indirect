<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CC Indirect - AI Code Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #08080c; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; padding: 40px; }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    p { color: #888; font-size: 1.1rem; }
    .status { margin-top: 20px; padding: 15px 30px; background: #1a1a24; border-radius: 8px; display: inline-block; }
    .status.success { border: 1px solid #3b82f6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>CC Indirect</h1>
    <p>AI-powered code generation and execution platform</p>
    <div class="status success">
      <p>✅ Backend: Running</p>
      <p style="margin-top: 10px;">Frontend: Building...</p>
    </div>
  </div>
</body>
</html>
